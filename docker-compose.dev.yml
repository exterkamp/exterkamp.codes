# Local dev stack: frontend + backend, no Cloudflare tunnel.
#
#   docker compose -p exterkamp-codes-site-dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The -p is not optional. Without it this stack's `frontend` container lands
# in the same project (and the same default network) as the real one
# docker-compose.yml's cloudflared points at — meaning every dev rebuild
# silently replaces whatever old.exterkamp.codes was serving live. That
# happened twice before this comment existed: once with a holding page, once
# with a bare "Hello, world". -p gives dev its own project name and its own
# default network, so it cannot collide with cloudflared's no matter what
# gets rebuilt here. See "A development stack" in web-nert/development.md
# for the fuller version of this same problem.
#
# cloudflared is already gated behind the `tunnel` profile in
# docker-compose.yml, so it doesn't need excluding here — this file only adds
# the one thing dev needs that production intentionally doesn't have: a
# published port. No IP prefix means it binds every interface, which is what
# makes it reachable from another device on the LAN or over Tailscale, not
# just this machine's loopback.
#
# 8086: 8080/8081 are nertz (prod/dev), 8083 is web-solitaire, 8085 is the
# chiptune studio, and 8082 -- despite being what web-solitaire's own compose
# comment earmarks for exterkamp.codes -- turned out to already be live,
# running the exterkamp-dot-codes (forklift) experiment. Override DEV_PORT if
# 8086 is taken too.
services:
  frontend:
    ports:
      - "${DEV_PORT:-8086}:80"
