<div class="color-controls" [style.display]="controlsVisible() ? 'block' : 'none'" #colorControls>
  <div class="drag" (pointerdown)="onDragStart($event)">
    <svg viewBox="0 0 20 20" width="15" height="15">
      <path fill="#0002" d="M2 11h16v2H2zm0-4h16v2H2zm8 11l3-3H7l3 3zm0-16L7 5h6l-3-3z" />
    </svg>
  </div>
  <details open>
    <summary>
      <span>control</span>
      <svg class="lh-chevron" viewBox="0 0 100 100">
        <g class="lh-chevron__lines">
          <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path>
          <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path>
        </g>
      </svg>
    </summary>
    <div class="controls-grid">
      <label for="accent">hue</label>
      <input type="range" id="accent" name="accent" min="0" max="360" [value]="accentHue()" (input)="onHueChange($event)" />
      <label for="lightness">lightness</label>
      <input type="range" id="lightness" name="lightness" min="0" max="1" step="0.01" [value]="lightness()" (input)="onLightnessChange($event)" />
      <label for="chroma">chroma</label>
      <input type="range" id="chroma" name="chroma" min="0" max="1" step="0.01" [value]="chroma()" (input)="onChromaChange($event)" />
    </div>
  </details>
</div>

<main>
  <div>
    <h1>
      exterkamp.codes<br id="title-break">
      <span class="highlight">under construction</span>
    </h1>
    <p>A new site is on its way. Nothing to see here yet.</p>
  </div>
</main>
