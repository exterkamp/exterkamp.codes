<div #stage class="stage">
  <!-- Note text is user-supplied: only ever bound as text, never as HTML. -->
  <div class="panels">
    @for (note of shown(); track $index) {
      <p class="panel" [class.active]="slots()[$index]">{{ note?.text }}</p>
    }
  </div>

  <pre #globe class="globe" aria-hidden="true"></pre>

  <svg class="links" aria-hidden="true">
    @for (note of shown(); track $index) {
      <g class="link" [class.active]="slots()[$index]">
        <line />
        <circle r="4" />
      </g>
    }
  </svg>
</div>

<div class="notes">
  @if (pending(); as spot) {
    <form class="note-form" (submit)="$event.preventDefault(); save(noteInput.value)" (keydown.escape)="cancel()">
      <label>
        Leave a note here ({{ spot.lat.toFixed(1) }}°, {{ spot.lon.toFixed(1) }}°)
        <input #noteInput type="text" [maxLength]="maxLength" autocomplete="off" required />
      </label>
      <button type="submit">Save</button>
      <button type="button" (click)="cancel()">Cancel</button>
    </form>
  }

  @if (error()) {
    <p class="note-error" role="alert">{{ error() }}</p>
  }
</div>
